[mod-name]
now-playing=Now Playing ♫

[mod-description]
now-playing=Shows you the title of the current music track.

[mod-setting-name]
nowplaying-print-chat=Also print in chat
nowplaying-padding-lines=Vertical position adjust

[mod-setting-description]
nowplaying-print-chat=Print the song title in an unobtrusive message in chat when it changes.
nowplaying-padding-lines=Amount of lines of space to leave above the "Now playing" label.\nSet to 1 when using the in-game UPS counter or clock, set to 2 when using both, set to 0 when using none.

[now-playing]
now-playing=♫ Now Playing:
no-music=(No music)
variable=(Variable)
